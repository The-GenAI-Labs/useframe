# Example only: placeholders, never real values. Create the real Secret out of band
# (kubectl create secret generic deploy-service-secrets --from-literal=...).
apiVersion: v1
kind: Secret
metadata:
  name: deploy-service-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/<db>?sslmode=require"
  REDIS_URL: "rediss://default:<password>@<host>:6379"
  INTERNAL_SERVICE_SECRET: "<same value as apps/server INTERNAL_SERVICE_SECRET>"
  CLOUDFLARE_ACCOUNT_ID: "<account-id>"
  CLOUDFLARE_API_TOKEN: "<runtime token: Workers KV Storage Edit + Zone Read>"
  CLOUDFLARE_ZONE_ID: "<zone-id, used from Stage 2>"
  SITES_KV_NAMESPACE_ID: "<terraform output kv_namespace_id>"
  SITES_R2_ACCESS_KEY_ID: "<R2 token: Object Read & Write on useframe-sites only>"
  SITES_R2_SECRET_ACCESS_KEY: "<R2 secret>"
