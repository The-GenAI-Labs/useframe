apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: server-secrets
  namespace: useframe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: server-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: useframe-prod-server-secrets
---
