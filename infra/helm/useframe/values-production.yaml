# Production overlay: sizing, replicas and hosts only. No secrets (they live in existing Secrets).
#   helm upgrade --install useframe infra/helm/useframe -n useframe -f infra/helm/useframe/values-production.yaml \
#     --set global.image.namespace=<ns> --set global.image.tag=sha-<gitsha> --atomic --timeout 10m
# Sizes are starting points; tune them after observing real usage (kubectl top pods).

global:
  # The images on Docker Hub are public, so nodes pull them anonymously.
  imagePullSecrets: []
  env:
    CLIENT_URL: https://useframe.in

services:
  server:
    env:
      FRONTEND_URL: https://useframe.in
      MEDIA_PUBLIC_BASE_URL: https://api.useframe.in
      GOOGLE_REDIRECT_URI: https://api.useframe.in/api/auth/google/callback
      GITHUB_REDIRECT_URI: https://api.useframe.in/api/auth/github/callback
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }

  # Public host for the browser's direct calls (NEXT_PUBLIC_ORCHESTRATOR_URL in apps/web). Same Ingress,
  # static IP, ManagedCertificate and SSE-length BackendConfig timeout as the api host.
  orchestrator-service:
    ingress:
      enabled: true
      host: orchestrator.useframe.in
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }

  research-service:
    env:
      RESEARCH_MOCK: "false"
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }

  # Off until infra/terraform/envs/production is applied: it needs SITES_KV_NAMESPACE_ID and the sites bucket.
  deploy-service-server:
    enabled: false
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

  # Stays off until both spikes in apps/deploy-service/RUNBOOK.md pass (§2 Stage 1 spike, S2.1
  # spike:domains) and the cluster is confirmed to be GKE Standard (README "Build worker"):
  #   gcloud container clusters describe <cluster> --location <loc> --format="value(autopilot.enabled)"
  # prints nothing / False on Standard. Sizes follow infra/k8s/deploy-service/worker.yaml.
  deploy-service-worker:
    enabled: false
    resources:
      requests: { cpu: "2", memory: 5Gi }
      limits: { cpu: "4", memory: 6Gi }

  # Razorpay posts webhooks straight to billing, so only that path is routed on the api host; every
  # other billing route stays in-cluster (apps/server calls it).
  billing-service:
    enabled: true
    replicas: 2
    ingress:
      enabled: true
      host: api.useframe.in
      path: /webhooks/razorpay
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

  scoring-service:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }

  # Needs the media bucket and media-service-secrets (ENV.md "media-service").
  media-service:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { memory: 3Gi }

  # One replica: every BullMQ worker inside it already runs with its own concurrency.
  worker:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { memory: 3Gi }

ingress:
  host: api.useframe.in
  gke:
    # gcloud compute addresses create useframe-api --global
    # api.useframe.in and orchestrator.useframe.in are both A records to this IP, DNS only (grey cloud).
    staticIpName: useframe-api

migration:
  enabled: true
