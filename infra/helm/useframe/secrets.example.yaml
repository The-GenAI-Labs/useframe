# EXAMPLE ONLY: every value is a placeholder. Never commit real values and never `kubectl apply` this
# file as is. Create each Secret out of band, for example from a git-ignored env file:
#   kubectl -n useframe create secret generic server-secrets --from-env-file=server.env
# One Secret per service; the names match `envFromSecrets` in values.yaml. ENV.md lists every key.
# Keys marked "optional" may be omitted. Shared values must be identical across Secrets:
#   INTERNAL_SERVICE_SECRET  -> every Secret that has it
#   JWT_ACCESS_SECRET        -> server-secrets and orchestrator-service-secrets
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"              # postgresql://<user>:<password>@<host>:5432/<db>?sslmode=require
  REDIS_URL: "REPLACE_ME"                 # rediss://default:<password>@<host>:6379
  JWT_ACCESS_SECRET: "REPLACE_ME"         # >= 32 chars; same value as orchestrator-service-secrets
  JWT_REFRESH_SECRET: "REPLACE_ME"        # >= 32 chars; different from the access secret
  INTERNAL_SERVICE_SECRET: "REPLACE_ME"   # >= 16 chars; same value in every Secret that has it
  GOOGLE_CLIENT_ID: "REPLACE_ME"          # OAuth client id (not secret, kept with its secret)
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  GITHUB_CLIENT_ID: "REPLACE_ME"          # OAuth client id (not secret, kept with its secret)
  GITHUB_CLIENT_SECRET: "REPLACE_ME"
  RESEND_API_KEY: "REPLACE_ME"            # transactional email
  TURNSTILE_SECRET_KEY: "REPLACE_ME"      # Cloudflare Turnstile server-side key
  IPQS_API_KEY: "REPLACE_ME"              # optional: IP reputation for signup risk scoring
  MEDIA_R2_ACCESS_KEY_ID: "REPLACE_ME"    # optional until media: R2 Object Read & Write on useframe-media only
  MEDIA_R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  MEDIA_SIGNING_SECRET: "REPLACE_ME"      # optional until media: >= 32 random bytes; signs /media URLs
  CLOUDFLARE_ACCOUNT_ID: "REPLACE_ME"     # optional: derives the R2 endpoint (or set MEDIA_R2_ENDPOINT)
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-service-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  JWT_ACCESS_SECRET: "REPLACE_ME"         # same value as server-secrets
  INTERNAL_SERVICE_SECRET: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"         # at least one of the four LLM keys is required
  DEEPSEEK_API_KEY: "REPLACE_ME"          # optional unless it is the only provider
  OPENAI_API_KEY: "REPLACE_ME"            # optional unless it is the only provider
  KIMI_API_KEY: "REPLACE_ME"              # optional unless it is the only provider
  BRAVE_API_KEY: "REPLACE_ME"             # optional: competitor discovery
  TYPESAFE_API_KEY: "REPLACE_ME"          # optional: JEV judge
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"       # optional: tracing
  LANGFUSE_SECRET_KEY: "REPLACE_ME"       # optional: tracing
---
apiVersion: v1
kind: Secret
metadata:
  name: research-service-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"                 # optional: retrieval cache
  INTERNAL_SERVICE_SECRET: "REPLACE_ME"
  VOYAGE_API_KEY: "REPLACE_ME"            # required for real retrieval (RESEARCH_MOCK=false)
  COHERE_API_KEY: "REPLACE_ME"            # reranking
  OPENAI_API_KEY: "REPLACE_ME"            # optional
  TYPESAFE_API_KEY: "REPLACE_ME"          # optional: JEV judge
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"       # optional
  LANGFUSE_SECRET_KEY: "REPLACE_ME"       # optional
---
# Shared by deploy-service-server and deploy-service-worker (same keys as
# infra/k8s/deploy-service/secret.example.yaml). The build child never inherits any of them.
apiVersion: v1
kind: Secret
metadata:
  name: deploy-service-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  INTERNAL_SERVICE_SECRET: "REPLACE_ME"
  CLOUDFLARE_ACCOUNT_ID: "REPLACE_ME"     # identifier (not secret, kept with the token)
  CLOUDFLARE_API_TOKEN: "REPLACE_ME"      # runtime token: Workers KV Storage Edit + Zone Read
  CLOUDFLARE_ZONE_ID: "REPLACE_ME"        # optional until custom domains (Stage 2)
  SITES_KV_NAMESPACE_ID: "REPLACE_ME"     # terraform output kv_namespace_id
  SITES_R2_ACCESS_KEY_ID: "REPLACE_ME"    # R2 token: Object Read & Write on useframe-sites only
  SITES_R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  MEDIA_R2_READ_ACCESS_KEY_ID: "REPLACE_ME"  # optional until media: R2 Object Read only on useframe-media
  MEDIA_R2_READ_SECRET_ACCESS_KEY: "REPLACE_ME"
---
# Only when services.media-service.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: media-service-secrets
  namespace: useframe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  INTERNAL_SERVICE_SECRET: "REPLACE_ME"   # same value as orchestrator-service-secrets (describe calls)
  CLOUDFLARE_ACCOUNT_ID: "REPLACE_ME"     # derives the R2 endpoint (or set MEDIA_R2_ENDPOINT)
  MEDIA_R2_ACCESS_KEY_ID: "REPLACE_ME"    # R2 Object Read & Write on useframe-media only
  MEDIA_R2_SECRET_ACCESS_KEY: "REPLACE_ME"
---
