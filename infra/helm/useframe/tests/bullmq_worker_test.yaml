suite: BullMQ worker (apps/worker)
templates: [templates/workloads.yaml]
release: { name: useframe, namespace: useframe }
set:
  global.image.namespace: acme
  global.image.tag: sha-abc1234
  services.worker.enabled: true
tests:
  - it: is disabled by default
    set:
      services.worker.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: useframe-worker
        not: true

  - it: runs node dist/index.js from useframe-worker as args so tini stays PID 1
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/acme/useframe-worker:sha-abc1234
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["node", "dist/index.js"]
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: gives Chromium a memory-backed /dev/shm and a writable /tmp on a read-only root
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - { name: tmp, emptyDir: { sizeLimit: 1Gi } }
            - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - { name: tmp, mountPath: /tmp }
            - { name: dshm, mountPath: /dev/shm }
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: [ALL] }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }

  - it: uses /tmp as HOME and gets in-cluster URLs plus HEALTH_PORT as plain config
    documentSelector:
      path: $[?(@.kind == "ConfigMap" && @.metadata.name == "useframe-worker-config")].kind
      value: ConfigMap
    asserts:
      - equal:
          path: data
          value:
            NODE_ENV: production
            HOME: /tmp
            HEALTH_PORT: "8080"
            ORCHESTRATOR_URL: http://useframe-orchestrator-service.useframe.svc.cluster.local:4001
            SCORING_SERVICE_URL: http://useframe-scoring-service.useframe.svc.cluster.local:4003

  - it: loads its keys from the worker-secrets Secret
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: { name: useframe-worker-config }
            - secretRef: { name: worker-secrets }

  - it: probes the health listener on HEALTH_PORT
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value: [{ name: http, containerPort: 8080, protocol: TCP }]
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value: { path: /healthz, port: http }
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: { path: /healthz, port: http }
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value: { path: /healthz, port: http }

  - it: has no Service, no ServiceAccount and no API token
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: useframe-worker
        not: true
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: useframe-worker
        not: true
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
        documentSelector:
          path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
          value: Deployment
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
        documentSelector:
          path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
          value: Deployment

  - it: drains for 600 s with no preStop sleep, and has no HPA or PDB
    asserts:
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 600 }
        documentSelector:
          path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
        documentSelector:
          path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
          value: Deployment
      - containsDocument:
          kind: HorizontalPodAutoscaler
          apiVersion: autoscaling/v2
          name: useframe-worker
        not: true
      - containsDocument:
          kind: PodDisruptionBudget
          apiVersion: policy/v1
          name: useframe-worker
        not: true

  - it: requests 1 CPU and 2Gi with a 3Gi memory limit
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 3Gi }

  - it: follows single-repo naming
    values: [../values-single-repo.yaml]
    documentSelector:
      path: $[?(@.kind == "Deployment" && @.metadata.name == "useframe-worker")].kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/acme/useframe:worker-sha-abc1234
