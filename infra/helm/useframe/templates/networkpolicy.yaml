{{- if .Values.networkPolicy.enabled }}
{{- $exposed := include "useframe.exposedKeys" . | fromJsonArray -}}
{{- range $key := keys .Values.services | sortAlpha }}
{{- $svc := index $.Values.services $key }}
{{- if $svc.enabled }}
{{- $w := include "useframe.workload" (dict "root" $ "svc" $svc) | fromYaml }}
{{- $version := include "useframe.imageVersion" (dict "root" $ "image" $w.image) }}
{{- $ctx := dict "root" $ "key" $key "version" $version }}
---
# Default-deny ingress. Egress stays open (DNS, Docker Hub, Cloudflare, databases, LLM providers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "useframe.fullname" $ctx }}
  labels:
    {{- include "useframe.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "useframe.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  {{- if $w.service.enabled }}
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
    {{- if has $key $exposed }}
    - from:
        {{- toYaml $.Values.networkPolicy.publicIngressFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
