name: Site edge Worker
on:
  pull_request:
    paths: ["apps/site-edge/**", ".github/workflows/site-edge.yml"]
  push:
    branches: [main]
    paths: ["apps/site-edge/**"]
jobs:
  check:
    # Typecheck, tests and a dry-run bundle only. Never deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @useframe/site-edge...
      - run: pnpm --filter @useframe/site-edge typecheck
      - run: pnpm --filter @useframe/site-edge test
      - run: pnpm --filter @useframe/site-edge deploy:dry
