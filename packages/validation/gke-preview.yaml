apiVersion: v1
kind: Namespace
metadata:
  name: useframe-validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: validation-preview-manager
  namespace: useframe-validation
rules:
  - apiGroups: [""]
    resources: [pods, configmaps]
    verbs: [create, get, patch, delete, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: validation-worker
  namespace: useframe-validation
subjects:
  - kind: ServiceAccount
    name: useframe-worker
    namespace: useframe
roleRef:
  kind: Role
  name: validation-preview-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolated-previews
  namespace: useframe-validation
spec:
  podSelector:
    matchLabels:
      app: validation-preview
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: useframe
          podSelector:
            matchLabels:
              app: useframe-worker
      ports:
        - protocol: TCP
          port: 3000
  egress: []
