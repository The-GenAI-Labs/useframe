packages:
  - "apps/*"
  - "packages/*"
  - "tests"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  playwright: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true
# Image scans fail on these CRITICAL CVEs: proxy-addr IP spoofing, and Go stdlib in esbuild builds older than 0.27.3.
overrides:
  proxy-addr: ^2.0.8
  esbuild: ^0.27.7
